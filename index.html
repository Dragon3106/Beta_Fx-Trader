<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BETA AVIATOR FIXED</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0e0e11;color:#fff;font-family:system-ui}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#1a1c25;border-bottom:1px solid #2a2d3e}
.logo{width:34px;height:34px;border-radius:8px;background:#ff0a54;display:flex;align-items:center;justify-content:center;font-weight:900}
.pill{padding:6px 12px;border-radius:20px;background:#212331;border:1px solid #ff0a54;color:#ff0a54;font-weight:800;font-size:11px}
.bal{margin-left:auto;padding:7px 14px;background:#212331;border-radius:20px;color:#f5b731;font-weight:900}
.hist{height:38px;display:flex;gap:6px;padding:6px 10px;background:#1a1c25;overflow-x:auto}
.h{padding:5px 10px;border-radius:20px;font-weight:800;font-size:12px;min-width:52px;text-align:center}.h.b{color:#3f90ff;background:#1a2a4a}.h.p{color:#c066ff;background:#2a1a4a}.h.g{color:#ff0a54;background:#3a1a2a}
#gameWrap{width:100%;height:52vh;background:radial-gradient(ellipse at bottom,#2a1040 0%,#0e0e11 70%);position:relative;overflow:hidden;border-bottom:2px solid #ff0a5422}
#c{width:100%;height:100%;display:block;background:transparent;position:absolute;left:0;top:0}
#plane{position:absolute;left:2%;bottom:15%;font-size:42px;z-index:5;transform:rotate(5deg);transition:none;will-change:left,bottom}
#mult{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;z-index:4;text-shadow:0 0 30px #ff0a54}
.centerMsg{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);text-align:center;z-index:6;background:rgba(0,0,0,0.7);padding:10px 20px;border-radius:12px;display:none}
.bets{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;background:#0e0e11}
.bCard{background:#1a1c25;border:1px solid #2a2d3e;border-radius:16px;padding:12px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.inp{flex:1;padding:12px;background:#0e0e11;border:1px solid #2a2d3e;border-radius:12px;color:#fff;font-weight:800;text-align:center}
.qBtn{padding:10px 12px;background:#212331;border:1px solid #2a2d3e;border-radius:10px;color:#8b8fa3;font-weight:800;cursor:pointer;min-width:42px}
.qBtn.on{border-color:#ff0a54;color:#fff;background:#2a1a25}
.betBtn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}
.betBtn.bet{background:#00c853;color:#fff}.betBtn.cash{background:#f5b731;color:#000}.betBtn.wait{background:#212331;color:#8b8fa3}
</style></head><body>
<div class="top"><div class="logo">✈</div><b>BETA</b><b style="color:#ff0a54"> AVIATOR</b><div class="pill" id="modePill" onclick="toggleMode()">REAL</div><div class="bal">K <span id="topBal">0.00</span></div></div>
<div class="hist" id="hist"></div>
<div id="gameWrap"><canvas id="c"></canvas><div id="plane">✈️</div><div id="mult">1.00x</div><div class="centerMsg" id="centerMsg"><div style="color:#ff0a54;font-weight:800">Waiting for next round</div><div id="cMult" style="font-size:28px;font-weight:900;margin-top:6px"></div></div></div>
<div class="bets">
<div class="bCard"><div style="font-size:11px;color:#8b8fa3">BET 1</div><div class="row"><button class="qBtn" onclick="chg(1,-10)">-</button><input id="amt1" class="inp" value="100.00"><button class="qBtn" onclick="chg(1,10)">+</button></div><div class="row"><button class="qBtn on" onclick="setQ(1,100,this)">100</button><button class="qBtn" onclick="setQ(1,200,this)">200</button><button class="qBtn" onclick="setQ(1,500,this)">500</button><button class="qBtn" onclick="setQ(1,1000,this)">1k</button></div><div class="row"><span style="font-size:11px;color:#8b8fa3">Auto Cash</span><input id="autoCash1" class="inp" placeholder="2.00" style="max-width:80px"></div><button class="betBtn bet" id="btn1" onclick="bet(1)">BET<br><span style="font-size:11px">KES 100</span></button></div>
<div class="bCard"><div style="font-size:11px;color:#8b8fa3">BET 2</div><div class="row"><button class="qBtn" onclick="chg(2,-10)">-</button><input id="amt2" class="inp" value="200.00"><button class="qBtn" onclick="chg(2,10)">+</button></div><div class="row"><button class="qBtn" onclick="setQ(2,100,this)">100</button><button class="qBtn on" onclick="setQ(2,200,this)">200</button><button class="qBtn" onclick="setQ(2,500,this)">500</button><button class="qBtn" onclick="setQ(2,1000,this)">1k</button></div><div class="row"><span style="font-size:11px;color:#8b8fa3">Auto Cash</span><input id="autoCash2" class="inp" placeholder="2.00" style="max-width:80px"></div><button class="betBtn bet" id="btn2" onclick="bet(2)">BET<br><span style="font-size:11px">KES 200</span></button></div>
</div>

<script>
let c=document.getElementById('c'), x=c.getContext('2d'), multEl=document.getElementById('mult'), plane=document.getElementById('plane'), msg=document.getElementById('centerMsg');
let W,H, phase='wait', mult=1, crash=2, t=0, path=[], history=[2.34,1.23,8.12,1.05,3.45], bets={}, balances={real:0,demo:10000}, mode='real';

function resize(){let w=document.getElementById('gameWrap'); W=w.clientWidth*2; H=w.clientHeight*2; c.width=W; c.height=H;}
resize(); window.addEventListener('resize',resize);

function drawCurve(){
 x.clearRect(0,0,W,H);
 if(path.length<2) return;
 x.beginPath(); x.moveTo(path[0].x,path[0].y);
 for(let i=1;i<path.length;i++) x.lineTo(path[i].x,path[i].y);
 x.strokeStyle='#ff0a54'; x.lineWidth=10; x.lineCap='round'; x.lineJoin='round'; x.stroke();
 x.lineTo(path[path.length-1].x,H); x.lineTo(0,H); x.closePath(); x.fillStyle='rgba(255,10,84,0.18)'; x.fill();
}
function loop(){
 if(phase==='wait'){
   mult=1; t=0; path=[]; plane.style.left='2%'; plane.style.bottom='15%'; plane.style.transform='rotate(5deg)'; multEl.innerText='1.00x'; multEl.style.color='#fff'; msg.style.display='block'; msg.innerHTML='<div style="color:#fff;font-weight:800">Waiting for next round</div><div style="color:#ff0a54;margin-top:4px">Bets open</div>';
   document.querySelectorAll('.betBtn').forEach(b=>{if(b.className.includes('wait')){b.className='betBtn bet';}});
   setTimeout(()=>{crash=Math.random()<0.5?1+Math.random()*0.8:Math.random()<0.85?2+Math.random()*3:5+Math.random()*15; if(Math.random()>0.93) crash=20+Math.random()*80; phase='fly'; msg.style.display='none'; t=0; path=[];},2500);
 }else if(phase==='fly'){
   t+=0.04; mult=Math.pow(1.08,t); if(mult>1.01) multEl.innerText=mult.toFixed(2)+'x';
   // MOVE PLANE WITH %
   let p=Math.min(t/20,1); // 0 to 1 progress
   let left=2+p*78; // 2% to 80%
   let bottom=15+Math.pow(p,1.7)*65; // 15% to 80%
   plane.style.left=left+'%'; plane.style.bottom=bottom+'%'; plane.style.transform='rotate('+(5+p*25)+'deg)';
   // trail for canvas
   let cx=(left/100)*W, cy=H-(bottom/100)*H; path.push({x:cx,y:cy}); if(path.length>100) path.shift(); drawCurve();
   // auto cash
   Object.keys(bets).forEach(k=>{if(bets[k].active){let ac=parseFloat(document.getElementById('autoCash'+k).value)||0; if(ac>0&&mult>=ac) doCash(k); let b=document.getElementById('btn'+k); if(b) b.innerHTML=`CASH OUT<br><span style="font-size:12px">KES ${(bets[k].amt*mult).toFixed(2)}</span>`;}});
   if(mult>=crash){
     phase='crash'; multEl.style.color='#ff0a54'; multEl.innerText=crash.toFixed(2)+'x'; msg.style.display='block'; msg.innerHTML='<div style="color:#ff0a54;font-weight:900">FLEW AWAY!</div><div style="color:#fff;font-size:28px;font-weight:900;margin-top:6px">'+crash.toFixed(2)+'x</div>';
     history.unshift(crash); if(history.length>20) history.pop(); renderHist(); plane.style.transform='rotate(45deg) scale(0.5)'; plane.style.opacity='0';
     Object.keys(bets).forEach(k=>{if(bets[k].active){bets[k].active=false; let b=document.getElementById('btn'+k); b.className='betBtn bet'; b.innerHTML=`BET<br><span>KES ${bets[k].amt}</span>`;}});
     setTimeout(()=>{plane.style.opacity='1'; phase='wait';},2000);
   }
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setInterval(drawCurve,60);

function renderHist(){document.getElementById('hist').innerHTML=history.map(v=>{let cls=v<2?'b':v<10?'p':'g'; return `<div class="h ${cls}">${v.toFixed(2)}x</div>`}).join('');}
renderHist();
function chg(id,d){let i=document.getElementById('amt'+id); let v=Math.max(10,(parseFloat(i.value)||0)+d); if(mode==='real'&&v>200) v=200; i.value=v.toFixed(2);}
function setQ(id,val,el){el.parentElement.querySelectorAll('.qBtn').forEach(b=>b.classList.remove('on')); el.classList.add('on'); document.getElementById('amt'+id).value=val.toFixed(2);}
function toggleMode(){mode=mode==='real'?'demo':'real'; document.getElementById('modePill').innerText=mode.toUpperCase(); document.getElementById('topBal').innerText=balances[mode].toFixed(2);}
function bet(id){let amt=parseFloat(document.getElementById('amt'+id).value)||0; if(amt>balances[mode]){alert('Low balance'); return;} if(mode==='real'&&amt>200){alert('Max 200'); return;} if(bets[id]?.active) return doCash(id); balances[mode]-=amt; document.getElementById('topBal').innerText=balances[mode].toFixed(2); bets[id]={amt:amt,active:true,mode:mode}; let b=document.getElementById('btn'+id); if(phase==='fly'){b.className='betBtn cash'; b.innerHTML=`CASH OUT<br><span>KES ${amt.toFixed(2)}</span>`;} else {b.className='betBtn wait'; b.innerHTML=`BET PLACED<br><span>Waiting</span>`;}}
function doCash(id){if(!bets[id]?.active) return; let win=bets[id].amt*mult; balances[bets[id].mode]+=win; if(bets[id].mode===mode) document.getElementById('topBal').innerText=balances[mode].toFixed(2); bets[id].active=false; let b=document.getElementById('btn'+id); b.className='betBtn bet'; b.innerHTML=`BET<br><span>KES ${bets[id].amt}</span>`;}
(function(){try{let u=JSON.parse(localStorage.getItem('beta_users')||'[]'); if(u.length>0){balances=u[0].balances||{real:0,demo:10000}; document.getElementById('topBal').innerText=balances[mode].toFixed(2);}}catch(e){}})();
</script></body></html>
