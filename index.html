<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BETA FX</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}.top{display:flex;align-items:center;gap:8px;padding:12px;background:#0a1628;border-bottom:1px solid #1e2d45}.logo{background:linear-gradient(135deg,#00e080,#00aaff);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:18px}.demo{padding:6px 14px;border-radius:20px;border:1px solid #f59e0b;color:#f59e0b;font-weight:900;font-size:12px;background:#000}.bal{padding:6px 12px;border-radius:20px;background:#111e2f;color:#f59e0b;font-weight:900;font-size:13px;border:1px solid #1e2d45}.add{width:32px;height:32px;background:#00e080;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;margin-left:auto}.head2{display:flex;align-items:center;gap:10px;padding:10px 14px}.price{font-size:26px;font-weight:900}.price.green{color:#00e080}.price.red{color:#ff2040}.pct{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:900}.pct.green{background:#00331a;color:#00e080}.pct.red{background:#33000a;color:#ff2040}.rate{margin-left:auto;background:#111;border:1px solid #333;padding:8px 14px;border-radius:10px;font-weight:900;font-size:14px}.tf{display:flex;gap:8px;padding:8px 12px}.tfb{padding:8px 16px;border-radius:10px;background:#111e2f;color:#6b7a90;border:none;font-weight:800;font-size:13px}.tfb.on{background:#1a3a2a;color:#00e080;border:1px solid #00e080}canvas{width:100%;height:50vh;background:#000;display:block}.panel{background:#0a1628;padding:14px}.amts{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chip{padding:12px 20px;background:#111e2f;border:1px solid #1e2d45;border-radius:12px;font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:6px}.chip.on{border-color:#00e080;background:#1a2a3a}.chip small{color:#55657a;font-size:11px}.info{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:#55657a;font-size:12px;font-weight:700}.dot{width:32px;height:32px;border:2px solid #00e080;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#00e080;font-weight:900}.buySell{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buy{background:#00e080;color:#000;padding:20px;border:none;border-radius:16px;font-weight:900;font-size:20px}.sell{background:#ff2040;color:#fff;padding:20px;border:none;border-radius:16px;font-weight:900;font-size:20px}.nav{display:flex;justify-content:space-around;padding:14px;background:#0a1628;border-top:1px solid #1e2d45;margin-top:12px}.nav div{text-align:center;color:#55657a;font-size:11px;font-weight:800}.nav div.on{color:#00e080}</style></head><body>
<div class="top"><div class="logo">B</div><div><b>BETA</b><b style="color:#00e080"> FX</b></div><span class="demo">DEMO</span><span class="bal">K 10,000.00</span><div class="add">+</div></div>
<div class="head2"><div class="price green" id="price">0.5516</div><div class="pct green" id="pct">+55.16%</div><div class="rate">Rate: <span id="rate">0.5516</span></div></div>
<div class="tf"><button class="tfb on">3s</button><button class="tfb">5s</button><button class="tfb">10s</button><button class="tfb">30s</button></div>
<canvas id="c"></canvas>
<div class="panel"><div class="amts"><div class="chip on"><small>KES</small>100</div><div class="chip">500</div><div class="chip">1,000</div><div class="chip">2,500</div><div class="chip">5,000</div></div><div class="info"><div style="display:flex;align-items:center;gap:8px"><div class="dot">3</div>DURATION</div><div>P&L <span style="color:#fff;font-size:16px">KES 0.00</span></div></div><div class="buySell"><button class="buy" onclick="trade('BUY')">BUY</button><button class="sell" onclick="trade('SELL')">SELL</button></div><div class="nav"><div class="on">⌂<br>TRADE</div><div>$<br>DEPOSIT</div><div>📊<br>HISTORY</div><div>👤<br>PROFILE</div></div></div>
<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),data=[],last=0.5;
function resize(){canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2}resize();window.onresize=resize;
for(let i=0;i<90;i++)data.push((Math.random()-0.5)*2.8);
function draw(){
 let W=canvas.width,H=canvas.height;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#121212';ctx.lineWidth=1;[0.2,0.4,0.6,0.8].forEach(p=>{ctx.beginPath();ctx.moveTo(0,H*p);ctx.lineTo(W,H*p);ctx.stroke()});
 ctx.strokeStyle='#1e2d45';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
 ctx.fillStyle='#333';ctx.font='bold 22px monospace';ctx.fillText('3.0',14,H*0.12);ctx.fillText('1.5',14,H*0.32);ctx.fillText('0.0',14,H*0.53);ctx.fillText('-1.5',14,H*0.73);ctx.fillText('-3.0',14,H*0.93);
 last+=(Math.random()-0.5)*0.18;if(Math.random()>0.82)last+=(Math.random()>0.5?1.3:-1.3);last=Math.max(-2.9,Math.min(2.9,last));data.push(last);if(data.length>90)data.shift();
 let step=W/(data.length-1);
 // GREEN above 0
 ctx.beginPath();let started=false;data.forEach((v,i)=>{let x=i*step,y=H/2 - v*H*0.13;if(v>=0){if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)}else started=false});ctx.strokeStyle='#00e080';ctx.lineWidth=3.5;ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,H/2);data.forEach((v,i)=>{let x=i*step,y=H/2 - v*H*0.13;if(v>=0)ctx.lineTo(x,y);else ctx.lineTo(x,H/2)});for(let i=data.length-1;i>=0;i--)if(data[i]>=0)ctx.lineTo(i*step,H/2);ctx.closePath();ctx.fillStyle='rgba(0,224,128,0.28)';ctx.fill();
 // RED below 0
 ctx.beginPath();started=false;data.forEach((v,i)=>{let x=i*step,y=H/2 - v*H*0.13;if(v<0){if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)}else started=false});ctx.strokeStyle='#ff2040';ctx.lineWidth=3.5;ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,H/2);data.forEach((v,i)=>{let x=i*step,y=H/2 - v*H*0.13;if(v<0)ctx.lineTo(x,y);else ctx.lineTo(x,H/2)});for(let i=data.length-1;i>=0;i--)if(data[i]<0)ctx.lineTo(i*step,H/2);ctx.closePath();ctx.fillStyle='rgba(255,32,64,0.28)';ctx.fill();
 // dot
 let ly=H/2 - last*H*0.13,lx=(data.length-1)*step;ctx.fillStyle=last>=0?'#00e080':'#ff2040';ctx.beginPath();ctx.arc(lx,ly,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lx,ly,4.5,0,Math.PI*2);ctx.fill();
 let show=(0.48+last*0.08).toFixed(4);document.getElementById('rate').innerText=show;document.getElementById('price').innerText=show;document.getElementById('price').className='price '+(last>=0?'green':'red');document.getElementById('pct').innerText=(last>=0?'+':'')+(last*20).toFixed(2)+'%';document.getElementById('pct').className='pct '+(last>=0?'green':'red');
}
setInterval(draw,110);
function trade(t){data.push(t==='BUY'?2.2:-2.2);if(navigator.vibrate)navigator.vibrate(50)}
// BETA FX brand tap logo to change demo balance
document.querySelector('.logo').onclick=()=>{let b=document.querySelector('.bal');b.innerText='K '+(10000+Math.floor(Math.random()*500))+'.00'}
</script></body></html>
