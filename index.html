</style></head><body>

<script>

let path=[];

function size(){let wrap=document.getElementById('gameWrap'); W=wrap.clientWidth*2; H=wrap.clientHeight*2; canvas.width=W; canvas.height=H;}
size(); window.onresize=size;

function draw(){
 if(!W) size();
 ctx.fillStyle='#0e0e11'; ctx.fillRect(0,0,W,H);
 // grid
 ctx.strokeStyle='#1a1c25'; ctx.lineWidth=2;
 for(let i=0;i<5;i++){ctx.beginPath(); ctx.moveTo(0,H*i/5); ctx.lineTo(W,H*i/5); ctx.stroke();}
 // curve
 if(path.length>1){
   ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y);
   for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x,path[i].y);
   ctx.strokeStyle='#ff0a54'; ctx.lineWidth=8; ctx.lineJoin='round'; ctx.stroke();
   ctx.lineTo(path[path.length-1].x,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fillStyle='rgba(255,10,84,0.15)'; ctx.fill();
 }
}
setInterval(draw,50);

function gameLoop(){

   document.getElementById('centerMsg').style.display='block'; document.getElementById('cText').innerText='Waiting for next round'; document.getElementById('cMult').innerText=''; mult=1; path=[]; t=0; multEl.style.color='#fff'; multEl.innerText='1.00x'; planeEl.style.left='10px'; planeEl.style.top=(H/2/2)+'px';
   setTimeout(()=>{crash=generateCrash(); phase='fly'; document.getElementById('centerMsg').style.display='none';},3000);
 } else if(phase==='fly'){

     phase='crash'; multEl.style.color='#ff0a54'; document.getElementById('centerMsg').style.display='block'; document.getElementById('cText').innerText='FLEW AWAY!'; document.getElementById('cMult').innerText=crash.toFixed(2)+'x';

     Object.keys(bets).forEach(k=>{if(bets[k].active){bets[k].active=false; resetBtn(k); addAllBets(`Player${k}`,bets[k].amt,0,crash);}});
     setTimeout(()=>{phase='wait';},2500);
   } else {

     let x=(t*40)*W/800, y=H - (Math.pow(t,1.6)*120 + 80); if(y<40) y=40;

     planeEl.style.left=(x/2-10)+'px'; planeEl.style.top=(y/2-20)+'px';
     // auto cashout
     Object.keys(bets).forEach(k=>{
       if(bets[k].active){
         let ac=parseFloat(document.getElementById('autoCash'+k).value)||0;
         if(ac>0 && mult>=ac) cash(k);
         document.getElementById('btn'+k).innerHTML=`CASH OUT<br><span style="font-size:11px">KES ${(bets[k].amt*mult).toFixed(2)}</span>`;
       }
     });
   }
 }
}
setInterval(gameLoop,80);
function generateCrash(){
 let r=Math.random();
 if(r<0.5) return 1+Math.random()*1; // 50% crash 1-2x
 if(r<0.85) return 2+Math.random()*3; // 35% 2-5x
 if(r<0.95) return 5+Math.random()*5; // 10% 5-10x
 return 10+Math.random()*90; // 5% 10-100x big
}
function renderHist(){document.getElementById('hist').innerHTML=history.map(v=>{let cls=v<2?'b':v<10?'p':'g'; return `<div class="h ${cls}">${v.toFixed(2)}x</div>`}).join('');}
renderHist();

function chg(id,delta){let inp=document.getElementById('amt'+id); let v=parseFloat(inp.value)||0; v=Math.max(10,v+delta); if(mode==='real'&&v>200) v=200; inp.value=v.toFixed(2); document.getElementById('btn'+id).innerHTML=`BET<br><span style="font-size:11px">KES ${v.toFixed(2)}</span>`;}
function setQ(id,val,el){el.parentElement.querySelectorAll('.qBtn').forEach(b=>b.classList.remove('on')); el.classList.add('on'); document.getElementById('amt'+id).value=val.toFixed(2); document.getElementById('btn'+id).innerHTML=`BET<br><span style="font-size:11px">KES ${val.toFixed(2)}</span>`;}
function toggleMode(){mode=mode==='real'?'demo':'real'; let p=document.getElementById('modePill'); p.innerText=mode.toUpperCase(); p.className='pill '+(mode==='demo'?'demo':''); document.getElementById('topBal').innerText=balances[mode].toFixed(2);}

 if(phase==='wait') document.getElementById('btn'+id).className='betBtn wait';

function cash(id){

}

function addAllBets(name,bet,win,m){
 let el=document.getElementById('allBets'); let div=document.createElement('div'); div.className='betRow';
 div.innerHTML=`<span>${name} - BET ${bet.toFixed(2)}</span><span style="color:${win>0?'#00c853':'#ff0a54'}">${win>
