<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beta_Fx V4.1 Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e1a;color:#fff}
.notice{background:#fef3c7;color:#92400e;padding:8px;text-align:center;font-size:11px;font-weight:bold}
.header{background:#111827;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#00d084;font-weight:bold}
.btn{background:#00d084;color:#000;padding:10px 18px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn2{background:#1f2937;color:#fff;border:1px solid #374151}
.nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#0f1422}
.nav button{padding:8px 14px;border-radius:20px;border:1px solid #374151;background:#1f2937;color:#9ca3af;font-size:12px}
.nav button.active{background:#00d084;color:#000;font-weight:bold}
.card{background:#1f2937;padding:16px;border-radius:12px;margin:10px 0}
.input{width:100%;padding:12px;border-radius:8px;border:1px solid #374151;background:#111827;color:#fff;margin:8px 0}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:99;padding:20px}
.modal.active{display:flex}
.box{background:#1f2937;padding:22px;border-radius:14px;width:100%;max-width:400px}
.dash{display:none;padding:12px;max-width:1150px;margin:auto}
.dash.active{display:block}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.bal{font-size:28px;color:#00d084;font-weight:bold}
.pill{background:#111827;padding:6px 10px;border-radius:20px;font-size:11px;display:inline-block;margin:3px}
.tv{height:360px;background:#111827;border-radius:12px;overflow:hidden;margin:12px 0}
.tab{display:none}.tab.active{display:block}
