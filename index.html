<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beta Aviator Demo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090a0f;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

/* LOGIN */
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:100%;
  background:#191c25;
  border:1px solid #303442;
  border-radius:25px;
  padding:30px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:25px;
  background:#ff0752;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

h1{
  font-size:38px;
  margin:25px 0 5px;
}

.pink{color:#ff0752}

input{
  width:100%;
  padding:18px;
  margin:10px 0;
  border-radius:15px;
  border:1px solid #333744;
  background:#0c0d11;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:18px;
  border:0;
  border-radius:15px;
  background:#ff0752;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.demo-note{
  color:#9da2b4;
  font-size:13px;
  margin-top:15px;
}

/* GAME */
#game{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
}

.balance{
  background:#191c25;
  padding:12px 18px;
  border-radius:12px;
}

.gamebox{
  position:relative;
  height:420px;
  overflow:hidden;
  border-radius:20px;
  background:
    radial-gradient(circle at 50% 100%,#20243b,#08090e 65%);
  border:1px solid #303442;
}

.multiplier{
  position:absolute;
  width:100%;
  text-align:center;
  top:130px;
  font-size:60px;
  font-weight:bold;
  color:#fff;
}

.plane{
  position:absolute;
  font-size:55px;
  left:30px;
  bottom:45px;
  transition:all .1s linear;
}

button.red{
  background:#ff0752;
}

button.gray{
  background:#292d39;
  margin-top:10px;
}

.controls{
  margin-top:15px;
  background:#191c25;
  padding:15px;
  border-radius:20px;
}

.players{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  pointer-events:none;
}

.player{
  background:rgba(25,28,37,.94);
  padding:9px 14px;
  margin-top:6px;
  border-radius:20px;
  width:max-content;
  font-size:13px;
  animation:rise 5s linear forwards;
}

@keyframes rise{
  from{
    transform:translateY(50px);
    opacity:0;
  }
  15%{opacity:1}
  to{
    transform:translateY(-300px);
    opacity:0;
  }
}

.warning{
  text-align:center;
  color:#ffb4c8;
  font-size:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="container">
    <div class="login-box">

      <div class="logo">✈</div>

      <h1>BETA <span class="pink">AVIATOR</span></h1>
      <p style="color:#9da2b4">Demo Mode</p>

      <input id="username"
             type="text"
             placeholder="PHONE / EMAIL / USERNAME">

      <input id="password"
             type="password"
             placeholder="PASSWORD">

      <button onclick="login()">Sign In</button>

      <p class="demo-note">
        This is a simulation. No real money or payments are used.
      </p>

    </div>
  </div>
</div>


<!-- GAME -->
<div id="game">
  <div class="container">

    <div class="top">
      <strong>BETA <span class="pink">AVIATOR</span></strong>

      <div class="balance">
        Demo Balance:
        <strong id="balance">10,000</strong>
      </div>
    </div>

    <div class="gamebox">

      <div class="multiplier" id="multiplier">
        1.00x
      </div>

      <div class="plane" id="plane">✈️</div>

    </div>

    <div class="controls">

      <input id="stake"
             type="number"
             value="100"
             min="1"
             placeholder="Demo stake">

      <button class="red" onclick="startGame()">
        START DEMO ROUND
      </button>

      <button class="gray" onclick="cashOut()">
        CASH OUT DEMO
      </button>

    </div>

    <div class="warning">
      SIMULATION ONLY • Virtual credits • No deposits or withdrawals
    </div>

  </div>
</div>

<!-- SIMULATED PLAYERS -->
<div class="players" id="players"></div>


<script>

let balance = 10000;
let multiplier = 1;
let running = false;
let timer;
let stake = 100;

function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  if(!username || !password){
    alert("Enter a demo username and password.");
    return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="block";

  createPlayers();
}


function startGame(){

  if(running) return;

  stake = Number(
    document.getElementById("stake").value
  );

  if(stake <= 0 || stake > balance){
    alert("Invalid demo stake.");
    return;
  }

  balance -= stake;
  updateBalance();

  multiplier = 1;
  running = true;

  const plane =
    document.getElementById("plane");

  const display =
    document.getElementById("multiplier");

  let position = 30;

  timer = setInterval(()=>{

    multiplier += 0.01 +
      Math.random()*0.04;

    position += 1.5;

    display.textContent =
      multiplier.toFixed(2)+"x";

    plane.style.left =
      Math.min(position,620)+"px";

    plane.style.bottom =
      Math.min(45 + position*.45,330)+"px";

    /*
      Random demo crash.
      This is only a local visual simulation.
    */
    if(multiplier > 1.5 &&
       Math.random() < 0.012){

      crash();
    }

  },100);

}


function cashOut(){

  if(!running) return;

  clearInterval(timer);
  running=false;

  const winnings =
    stake * multiplier;

  balance += winnings;

  updateBalance();

  alert(
    "Demo cash-out: " +
    winnings.toFixed(2) +
    " virtual credits"
  );

}


function crash(){

  clearInterval(timer);
  running=false;

  alert(
    "Demo round ended at " +
    multiplier.toFixed(2) +
    "x"
  );

}


function updateBalance(){

  document.getElementById("balance")
    .textContent =
    balance.toLocaleString(
      undefined,
      {maximumFractionDigits:2}
    );
}


/*
 Simulated players.
 Clearly marked as simulation rather
 than representing real users.
*/

const names=[
  "Player_204",
  "Trader_81",
  "DemoUser_44",
  "Player_712",
  "Guest_92",
  "Demo_501"
];

function createPlayers(){

  setInterval(()=>{

    const box =
      document.getElementById("players");

    const player =
      document.createElement("div");

    player.className="player";

    const name =
      names[
        Math.floor(Math.random()*names.length)
      ];

    const amount =
      Math.floor(Math.random()*900)+100;

    player.innerHTML =
      "SIMULATED • " +
      name +
      " • Demo " +
      amount +
      " credits";

    box.appendChild(player);

    setTimeout(()=>{
      player.remove();
    },5000);

  },1200);

}

</script>

</body>
</html>
