<button style="flex:1;padding:10px;background:#1e202f;border-radius:8px;color:#aaa;border:1px solid #2a2d40" onclick="alert('Deposit: Send Money ONLY to 0716580098\nRAYLABS HQ\nNo Till, No Paybill')">DEPOSIT 0716580098</button>
</div>
</div>

<script>
// FORCE OPEN GAME - NO BLOCKING VALIDATION
let curName = 'Don';
let curPhone = '0716580098';
let balDemo = 5000;
let mult = 1, crash = 2, flying = false, t = 0, bets = {};

function openGameNow(){
  let nameInput = document.getElementById('u').value.trim() || curName;
  let phoneInput = document.getElementById('p').value.trim() || curPhone;
  if(phoneInput.length < 7) phoneInput = '0716580098';
  curName = nameInput;
  curPhone = phoneInput;
  document.getElementById('auth').style.display='none';
  let g = document.getElementById('game');
  g.style.display='flex';
  document.getElementById('nameTop').innerText = curName;
  document.getElementById('phoneTop').innerText = 'CLIENT: '+curPhone;
  document.getElementById('avatarTop').innerText = curName[0].toUpperCase();
  document.getElementById('balTop').innerText = balDemo;
}

// ALL BUTTONS = TAP = OPEN GAME INSTANTLY
window.addEventListener('DOMContentLoaded', function(){
  let c = document.getElementById('createBtn');
  let d = document.getElementById('demoBtn');

  function tapCreate(e){
    if(e) e.preventDefault();
    openGameNow();
  }
  function tapDemo(e){
    if(e) e.preventDefault();
    curName = document.getElementById('u').value.trim() || 'Don';
    curPhone = document.getElementById('p').value.trim() || '0716580098';
    balDemo = 5000;
    openGameNow();
  }

  // bind 4 ways so it MUST work on your phone
  c.addEventListener('click', tapCreate);
  c.addEventListener('touchend', tapCreate);
  c.addEventListener('touchstart', tapCreate);
  c.onclick = tapCreate;

  d.addEventListener('click', tapDemo);
  d.addEventListener('touchend', tapDemo);
  d.addEventListener('touchstart', tapDemo);
  d.onclick = tapDemo;

  // also if user presses Enter
  document.getElementById('pw').addEventListener('keydown', function(e){
    if(e.key==='Enter') tapCreate();
  });
});

// AVIATOR LOOP
function loop(){
  if(!flying){
    t=0; mult=1;
    let m = document.getElementById('mult');
    if(m) m.innerText='1.00x';
    let pl = document.getElementById('plane');
    pl.style.left='5%'; pl.style.bottom='30%'; pl.style.opacity='1';
    let msg = document.getElementById('msg');
    if(msg) msg.style.display='block';
    setTimeout(()=>{
      crash = Math.random()<0.5? 1+Math.random() : 2+Math.random()*3;
      if(Math.random()>0.88) crash = 8+Math.random()*15;
      flying=true; t=0;
      if(msg) msg.style.display='none';
    },2000);
  }else{
    t+=0.032;
    mult = Math.pow(1.082, t*1.1);
    let m = document.getElementById('mult');
    if(m) m.innerText = mult.toFixed(2)+'x';
    let prog = Math.min(t/14,1);
    let pl = document.getElementById('plane');
    pl.style.left = (5+prog*70)+'%';
    pl.style.bottom = (30+prog*50)+'%';
    for(let id in bets){
      if(bets[id].active){
        let b = document.getElementById('b'+id);
        if(b) b.innerText = 'CASH OUT '+(bets[id].amt*mult).toFixed(0);
      }
    }
    if(mult>=crash){
      flying=false;
      if(m) m.innerText = crash.toFixed(2)+'x';
      let msg = document.getElementById('msg');
      if(msg){ msg.style.display='block'; msg.innerHTML='FLEW AWAY! '+crash.toFixed(2)+'x'; }
      pl.style.opacity='0';
      for(let id in bets){
        if(bets[id].active){
          bets[id].active=false;
          let b = document.getElementById('b'+id);
          if(b){ b.innerText='BET '+bets[id].amt; b.style.background='#00e676'; }
        }
      }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
