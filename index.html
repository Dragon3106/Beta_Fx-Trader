<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V19 BRIEF</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;color:#fff;font-family:system-ui}.b{display:flex;gap:6px;padding:8px;background:#000;overflow-x:auto;position:sticky;top:0;z-index:99}.bt{padding:10px 14px;border-radius:20px;border:1px solid #333;background:#1a2332;color:#fff;font-weight:900;font-size:11px}.bt.on{background:#00d084;color:#000}.c{background:#1a2332;border-radius:14px;padding:14px;margin:8px}.i{width:100%;padding:14px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;margin:6px 0}.bn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900}.g{background:#00d084}.r{background:#ef4444;color:#fff}#a{position:fixed;inset:0;background:#0a0e1a;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.bo{background:#1a2332;border:2px solid #00d084;border-radius:16px;padding:20px;width:100%;max-width:360px}</style></head><body>
<div id="a"><div class="bo"><h2 style="text-align:center;color:#00d084">V19 BRIEF</h2><input id="u" class="i" placeholder="Name"><button class="bn g" onclick="go()">ENTER</button><div style="margin-top:10px"><button class="bn" style="background:#333" onclick="quick()">👑 Admin</button></div></div></div>
<div class="b"><button id="b1" class="bt on" onclick="pg('1')">P1 Trading</button><button id="b2" class="bt" onclick="pg('2')">P2 Graphs</button><button id="b3" class="bt" onclick="pg('3')">Deposit</button><button id="b4" class="bt" onclick="pg('4')">Withdraw</button><button class="bt" onclick="lo()">Out</button></div>
<div style="text-align:center;padding:6px;background:#00d084;color:#000;font-weight:900;font-size:11px"><span id="ui"></span></div>
<div style="max-width:500px;margin:0 auto"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px"><div class="c"><small>VIRT</small><div style="font-size:26px;font-weight:900;color:#00d084" id="vb">$10000</div></div><div class="c"><small>REAL</small><div style="font-size:26px;font-weight:900;color:#f59e0b" id="rb">KES 0</div></div></div>
<div id="p1"><div class="c" style="padding:0"><canvas id="c1" style="width:100%;height:260px;background:#000"></canvas></div><div class="c"><input id="am1" class="i" type="number" value="100"><button class="bn g" onclick="tr('BUY','1')">BUY +8.5%</button><button class="bn r" style="margin-top:6px" onclick="tr('SELL','1')">SELL -6%</button><div id="m1" style="text-align:center;font-weight:900;margin-top:8px"></div><div id="h1" style="font-size:12px;margin-top:8px"></div></div></div>
<div id="p2" style="display:none"><div class="c" style="padding:0"><canvas id="c2" style="width:100%;height:220px;background:#000"></canvas></div><div class="c"><canvas id="bA" style="max-height:200px"></canvas><canvas id="bB" style="max-height:160px;margin-top:10px"></canvas></div><div class="c"><input id="am2" class="i" type="number" value="100"><button class="bn g" onclick="tr('BUY','2')">BUY P2</button><button class="bn r" style="margin-top:6px" onclick="tr('SELL','2')">SELL P2</button><div id="m2" style="text-align:center;font-weight:900;margin-top:8px"></div><div id="h2" style="font-size:12px;margin-top:8px"></div></div></div>
<div id="p3" style="display:none"><div class="c"><b>Deposit 0716580098</b><input id="da" class="i" type="number" placeholder="Amount"><input id="dc" class="i" placeholder="M-Pesa Code"><button class="bn" style="background:#f59e0b" onclick="dep()">SUBMIT</button><div id="dm" style="margin-top:8px;font-weight:800"></div></div><div class="c"><div id="dh" style="font-size:12px"></div></div></div>
<div id="p4" style="display:none"><div class="c"><b>Withdraw Min 200</b><div>Real: <span id="rw" style="color:#f59e0b;font-weight:900"></span></div><input id="wa" class="i" type="number" placeholder="Amount"><input id="wp" class="i" placeholder="M-Pesa No"><button class="bn g" onclick="wit()">REQUEST</button><div id="wm" style="margin-top:8px;font-weight:800"></div></div><div class="c"><div id="wh" style="font-size:12px"></div></div></div>
<div id="ad" style="display:none" class="c"><b>ADMIN</b><div id="apD"></div><div id="apW" style="margin-top:8px"></div><div id="au" style="font-size:11px;margin-top:8px"></div></div>
</div>
<script>
let cur=null,us=[],ds=[],ws=[],chs=[],iv=null;try{us=JSON.parse(localStorage.getItem('v19_u')||'[]')}catch(e){}try{ds=JSON.parse(localStorage.getItem('v19_d')||'[]')}catch(e){}try{ws=JSON.parse(localStorage.getItem('v19_w')||'[]')}catch(e){}
function sv(){localStorage.setItem('v19_u',JSON.stringify(us));localStorage.setItem('v19_d',JSON.stringify(ds));localStorage.setItem('v19_w',JSON.stringify(ws));if(cur)localStorage.setItem('v19_c',cur.user)}
function go(){let u=document.getElementById('u').value.trim();if(!u)return;let f=us.find(x=>x.user.toLowerCase()===u.toLowerCase());if(f)cur=f;else{cur={user:u,v:10000,r:0,tr:[]};us.push(cur)}sv();document.getElementById('a').style.display='none';up();pg('1');live()}
function quick(){let f=us.find(x=>x.user==='Dragon 3106');if(f)cur=f;else{cur={user:'Dragon 3106',v:10044,r:1500,tr:Array(8).fill(0).map(()=>({ty:'BUY',am:100,pnl:8}))};us.push(cur)}sv();document.getElementById('a').style.display='none';up();pg('1');live()}
function lo(){cur=null;localStorage.removeItem('v19_c');document.getElementById('a').style.display='flex';clearInterval(iv)}
function pg(n){['1','2','3','4'].forEach(x=>document.getElementById('p'+x).style.display='none');document.getElementById('p'+n).style.display='block';['b1','b2','b3','b4'].forEach(b=>document.getElementById(b).classList.remove('on'));document.getElementById('b'+n).classList.add('on');if(n==='2')setTimeout(bars,200);up()}
function up(){if(!cur)return;document.getElementById('ui').innerText=cur.user+' $'+cur.v.toFixed(0)+' KES '+cur.r.toFixed(0);document.getElementById('vb').innerText='$'+cur.v.toFixed(0);document.getElementById('rb').innerText='KES '+cur.r.toFixed(0);document.getElementById('rw').innerText='KES '+cur.r.toFixed(0);['1','2'].forEach(s=>{let h=document.getElementById('h'+s);if(h)h.innerHTML=cur.tr.slice(-4).reverse().map(t=>t.ty+' $'+t.am+' <span style="color:'+(t.pnl>=0?'#00d084':'#ef4444')+'">'+t.pnl.toFixed(1)+'</span>').join('<br>')||'No trades'});document.getElementById('dh').innerHTML=ds.filter(d=>d.user===cur.user).map(d=>d.code+' KES '+d.amt+' '+d.st).join('<br>')||'No deposits';document.getElementById('wh').innerHTML=ws.filter(w=>w.user===cur.user).map(w=>'KES '+w.amt+' '+w.st).join('<br>')||'No withdraws';let pd=ds.filter(d=>d.st==='PENDING');let pw=ws.filter(w=>w.st==='PENDING');document.getElementById('apD').innerHTML=pd.map(d=>d.user+' KES '+d.amt+' '+d.code+' <button onclick="aD(\''+d.code+'\')">OK</button>').join('<br>');document.getElementById('apW').innerHTML=pw.map((w,i)=>w.user+' KES '+w.amt+' <button onclick="aW('+ws.indexOf(w)+')">SEND</button>').join('<br>');document.getElementById('au').innerHTML=us.map(u=>u.user+' $'+u.v.toFixed(0)).join('<br>');document.getElementById('ad').style.display=cur.user==='Dragon 3106'?'block':'none'}
function tr(ty,ver){let am=parseFloat(document.getElementById('am'+ver).value)||0;if(am>cur.v)return;let win=Math.random()>0.35;let pnl=win?am*0.085:-am*0.06;cur.v+=pnl;cur.tr.push({ty,am,pnl});sv();document.getElementById('m'+ver).innerText=(win?'WIN ':'LOSS ')+pnl.toFixed(1);up();bars()}
function dep(){let am=parseFloat(document.getElementById('da').value)||0;let cd=document.getElementById('dc').value.trim().toUpperCase();if(!am||cd.length<3)return;ds.push({user:cur.user,amt:am,code:cd,st:'PENDING'});sv();document.getElementById('dm').innerText='✅ '+cd+' submitted';up()}
function wit(){let am=parseFloat(document.getElementById('wa').value)||0;let ph=document.getElementById('wp').value.trim()||'0716580098';if(am<200||am>cur.r)return;ws.push({user:cur.user,amt:am,phone:ph,st:'PENDING'});cur.r-=am;sv();document.getElementById('wm').innerText='✅ KES '+am+' requested';up()}
function aD(c){let d=ds.find(x=>x.code===c);let u=us.find(x=>x.user===d.user);d.st='APPROVED';u.r+=d.amt;sv();up()}function aW(i){ws[i].st='APPROVED';sv();up()}
function live(){if(iv)clearInterval(iv);dl('c1');dl('c2');iv=setInterval(()=>{dl('c1');dl('c2')},2500)}
function dl(id){let ca=document.getElementById(id);if(!ca)return;let ctx=ca.getContext('2d');let W=ca.width=ca.offsetWidth*2;let H=ca.height=(id==='c1'?260:220)*2;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let d=[];let l=1.08;for(let i=0;i<50;i++){l+=(Math.random()-0.49)*0.001;d.push(l)}let mn=Math.min(...d),mx=Math.max(...d);ctx.beginPath();ctx.strokeStyle='#00d084';ctx.lineWidth=4;d.forEach((v,i)=>{let x=W/50*i;let y=H-((v-mn)/(mx-mn||0.001))*H*0.8-H*0.1;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}
function bars(){chs.forEach(c=>{try{c.destroy()}catch(e){}});chs=[];if(!cur||!cur.tr.length)return;let last=cur.tr.slice(-6);let a=document.getElementById('bA');if(a)chs.push(new Chart(a,{type:'bar',data:{labels:last.map((_,[STRIPPED] $',data:last.map(t=>t.pnl),[STRIPPED] b=document.getElementById('bB');if(b){let w=cur.tr.filter(t=>t.pnl>0).length;chs.push(new Chart(b,{type:'bar',data:{labels:['Wins',[STRIPPED]
let s=localStorage.getItem('v19_c');if(s){let f=us.find(x=>x.user===s);if(f){cur=f;document.getElementById('a').style.display='none';up();pg('1');live()}}
</script></body></html>
