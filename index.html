<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BETA FX</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}
.top{height:64px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#111827;border-bottom:1px solid #1e293b;overflow:hidden}
.logo{min-width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#00ff88,#00aaff);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:20px}
.real{padding:8px 16px;border-radius:20px;border:1.5px solid #00ff88;color:#00ff88;background:#001a0f;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap}
.kBal{min-width:90px;padding:8px 12px;border-radius:20px;background:#1f2937;border:1px solid #334155;color:#f59e0b;font-weight:900;display:flex;gap:6px;align-items:center}
.add{min-width:36px;height:36px;background:#00ff88;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;cursor:pointer}
.priceRow{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#000}
.price{font-size:26px;font-weight:900;color:#00ff88}.pct{padding:4px 10px;border-radius:8px;background:#00331a;color:#00ff88;font-weight:900;font-size:12px}
.tf{height:56px;display:flex;gap:8px;padding:8px 12px;background:#000;align-items:center}.tfb{min-width:52px;padding:10px 0;border-radius:10px;background:#1e293b;color:#64748b;border:1px solid #334155;font-weight:800;cursor:pointer;text-align:center}.tfb.on{background:#002e1f;color:#00ff88;border-color:#00ff88}
#chartWrap{width:100%;height:52vh;background:#000;position:relative}
#c{width:100%;height:100%;display:block;background:#000}
.stakeRow{display:flex;gap:8px;padding:10px 12px;background:#0f172a;overflow-x:auto}.chip{padding:12px 18px;background:#1e293b;border:1px solid #334155;border-radius:12px;font-weight:900;cursor:pointer;white-space:nowrap}.chip.on{border-color:#00ff88;background:#002e1f}
.mid{display:flex;justify-content:space-between;padding:10px 12px;background:#0f172a;align-items:center}.durCircle{width:40px;height:40px;border:2px solid #00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#00ff88;font-weight:900;cursor:pointer}
.buySell{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 12px;background:#0f172a}.buy{background:#00ff88;color:#000;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:18px}.sell{background:#ff2040;color:#fff;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:18px}
.nav{display:flex;justify-content:space-around;padding:10px;background:#0f172a;border-top:1px solid #1e293b}.nav div{color:#475569;font-size:11px;font-weight:800;text-align:center}.nav div.on{color:#00ff88}
</style></head><body>
<div class="top"><div class="logo">B</div><div style="line-height:1"><b>BETA</b><br><b style="color:#00ff88">FX</b></div><div class="real" id="modeBtn" onclick="toggleMode()">REAL</div><div class="kBal"><span style="background:#f59e0b;color:#000;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px">K</span><span id="bal">0.00</span></div><div class="add" onclick="location.href='#deposit'">+</div><div style="margin-left:auto;background:#1e293b;padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px;max-width:90px;white-space:nowrap;overflow:hidden">Dragon ▼</div></div>
<div class="priceRow"><div class="price" id="price">0.6929</div><div class="pct" id="pct">+69.29%</div><div style="margin-left:auto;color:#666;font-size:12px">Rate: <span id="rate">0.6929</span></div></div>
<div class="tf"><button class="tfb on" id="b3" onclick="setTF(3)">3s</button><button class="tfb" id="b5" onclick="setTF(5)">5s</button><button class="tfb" id="b10" onclick="setTF(10)">10s</button><button class="tfb" id="b30" onclick="setTF(30)">30s</button></div>
<div id="chartWrap"><canvas id="c"></canvas></div>
<div class="stakeRow"><div class="chip on" onclick="setStake(100,this)">KES 100</div><div class="chip" onclick="setStake(500,this)">500</div><div class="chip" onclick="setStake(1000,this)">1,000</div><div class="chip" onclick="setStake(2500,this)">2,500</div></div>
<div class="mid"><div style="display:flex;gap:10px;align-items:center"><div class="durCircle" id="dur" onclick="cycle()">3</div><span style="color:#666;font-size:12px">DURATION</span></div><div style="color:#666;font-size:12px">P&L <b style="color:#fff" id="pnl">KES 0.00</b></div></div>
<div class="buySell"><button class="buy" onclick="trade('BUY')">BUY</button><button class="sell" onclick="trade('SELL')">SELL</button></div>
<div class="nav"><div class="on">⌂<br>TRADE</div><div>$<br>DEPOSIT</div><div>📊<br>HISTORY</div><div>👤<br>PROFILE</div></div>

<script>
// FIXED CHART - FORCED DRAW
let canvas=document.getElementById('c');
let ctx=canvas.getContext('2d');
let W,H,data=[],target=0,tf=3,stake=100,balance=0,pnl=0;
function fixSize(){
 let wrap=document.getElementById('chartWrap');
 W=wrap.clientWidth*2;
 H=wrap.clientHeight*2;
 canvas.width=W;
 canvas.height=H;
}
fixSize();
window.addEventListener('resize',fixSize);
for(let i=0;i<80;i++) data.push((Math.random()-0.5)*0.8);

function draw(){
 if(!W) fixSize();
 ctx.fillStyle='#000000';
 ctx.fillRect(0,0,W,H);
 // grid
 ctx.strokeStyle='#111111';
 ctx.lineWidth=2;
 ctx.beginPath(); ctx.moveTo(0,H*0.25); ctx.lineTo(W,H*0.25); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(0,H*0.5); ctx.lineTo(W,H*0.5); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(0,H*0.75); ctx.lineTo(W,H*0.75); ctx.stroke();
 // center line
 ctx.strokeStyle='#1e293b'; ctx.lineWidth=3;
 ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
 // labels
 ctx.fillStyle='#334155'; ctx.font='bold 28px monospace';
 ctx.fillText('3.0',20,H*0.15); ctx.fillText('1.5',20,H*0.35); ctx.fillText('0.0',20,H*0.52); ctx.fillText('-1.5',20,H*0.72); ctx.fillText('-3.0',20,H*0.92);

 // UPDATE - orderly blocky like MaliCrush screenshot
 target+=(Math.random()-0.5)*0.3;
 target=Math.max(-2.2,Math.min(2.2,target));
 let last=data[data.length-1];
 let next=last+(target-last)*0.25;
 if(Math.random()>0.88) next+=(Math.random()>0.5?1.1:-1.1); // spike
 data.push(next); if(data.length>80) data.shift();

 let step=W/(data.length-1);
 // GREEN AREA ABOVE 0
 ctx.beginPath();
 let started=false;
 for(let i=0;i<data.length;i++){
   let x=i*step, y=H/2 - data[i]*H*0.18;
   if(data[i]>=0){ if(!started){ctx.moveTo(x,y); started=true} else ctx.lineTo(x,y); } else started=false;
 }
 ctx.strokeStyle='#00ff88'; ctx.lineWidth=6; ctx.lineJoin='round'; ctx.stroke();
 ctx.lineTo(W,H/2); ctx.lineTo(0,H/2); ctx.closePath(); ctx.fillStyle='rgba(0,255,136,0.30)'; ctx.fill();

 // RED AREA BELOW 0
 ctx.beginPath(); started=false;
 for(let i=0;i<data.length;i++){
   let x=i*step, y=H/2 - data[i]*H*0.18;
   if(data[i]<0){ if(!started){ctx.moveTo(x,y); started=true} else ctx.lineTo(x,y); } else started=false;
 }
 ctx.strokeStyle='#ff4444'; ctx.lineWidth=6; ctx.stroke();
 ctx.lineTo(W,H/2); ctx.lineTo(0,H/2); ctx.closePath(); ctx.fillStyle='rgba(255,68,68,0.30)'; ctx.fill();

 // dot
 let ly=H/2 - data[data.length-1]*H*0.18, lx=(data.length-1)*step;
 ctx.fillStyle=data[data.length-1]>=0?'#00ff88':'#ff4444'; ctx.beginPath(); ctx.arc(lx,ly,14,0,Math.PI*2); ctx.fill();
 ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(lx,ly,5,0,Math.PI*2); ctx.fill();

 // price
 let price=(0.4+Math.abs(next)*0.15+0.2).toFixed(4);
 document.getElementById('price').innerText=price;
 document.getElementById('rate').innerText=price;
 let pct=(next*28).toFixed(2);
 document.getElementById('pct').innerText=(next>=0?'+':'')+pct+'%';
 document.getElementById('price').style.color=next>=0?'#00ff88':'#ff4444';
 document.getElementById('pct').style.color=next>=0?'#00ff88':'#ff4444';
 document.getElementById('pct').style.background=next>=0?'#00331a':'#33000a';
 requestAnimationFrame(draw);
}
draw(); // START IMMEDIATELY

function setTF(v){tf=v; document.querySelectorAll('.tfb').forEach(b=>b.classList.remove('on')); document.getElementById('b'+v).classList.add('on'); document.getElementById('dur').innerText=v;}
function setStake(v,el){stake=v; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); el.classList.add('on');}
function toggleMode(){let b=document.getElementById('modeBtn'); b.innerText=b.innerText==='REAL'?'DEMO':'REAL';}
function cycle(){let seq=[3,5,10,30]; let idx=seq.indexOf(tf); setTF(seq[(idx+1)%seq.length]);}
function trade(type){pnl+=(Math.random()>0.5?stake*0.8:-stake); document.getElementById('pnl').innerText='KES '+pnl.toFixed(2); document.getElementById('pnl').style.color=pnl>=0?'#00ff88':'#ff4444'; if(navigator.vibrate) navigator.vibrate(type==='BUY'?50:100);}
</script></body></html>
