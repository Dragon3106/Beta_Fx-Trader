<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7 - Screenshot Match</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0e1525;color:#fff;font-family:system-ui}.top{display:flex;gap:10px;padding:12px;overflow-x:auto}.pill{padding:12px 22px;border-radius:24px;border:none;font-weight:900;font-size:15px;white-space:nowrap;cursor:pointer}.on{background:#00e080;color:#000}.off{background:#1e293b;color:#9ca3af}.balRow{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;padding:12px}.balCard{background:#1a2332;border-radius:16px;padding:16px}.balCard b{font-size:12px;color:#9ca3af;font-weight:600}.balCard .v{font-size:32px;font-weight:900;color:#00e080;margin:4px 0}.chartWrap{background:#000;border:1px solid #1e293b;border-radius:12px;margin:12px;overflow:hidden}.tf{display:flex;gap:6px;padding:8px;background:#111827;align-items:center;flex-wrap:wrap}.tfb{padding:8px 12px;border-radius:8px;background:#1e293b;color:#9ca3af;border:none;font-weight:700;font-size:14px}.tfb.on{background:#374151;color:#fff}.inp{width:100%;padding:16px;background:#0f172a;border:1px solid #1e293b;color:#fff;border-radius:12px;margin:8px 0;font-size:16px;font-weight:700}.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.buy{background:#00e080;color:#000;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:18px}.sell{background:#ef4444;color:#fff;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:18px}.card{background:#1a2332;border-radius:16px;padding:16px;margin:12px}#auth{position:fixed;inset:0;background:#0e1525;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.box{background:#1a2332;border:2px solid #00e080;border-radius:16px;padding:20px;width:100%;max-width:380px}</style></head><body>
<div id="auth"><div class="box"><h2 style="text-align:center;color:#00e080">BETA_FX V7</h2><p style="text-align:center;color:#9ca3af;font-size:12px">Screenshot Match + Login</p><input id="u" class="inp" placeholder="Username"><input id="p" class="inp" type="password" placeholder="Password"><button class="buy" style="width:100%" onclick="login()">LOGIN $10000</button><button style="width:100%;margin-top:8px;padding:14px;background:#333;color:#f59e0b;border:none;border-radius:12px;font-weight:900" onclick="admin()">Admin Dragon 3106</button></div></div>

<div class="top"><button id="t1" class="pill on" onclick="pg('trading')">Trading</button><button id="t2" class="pill off" onclick="pg('portfolio')">Portfolio</button><button id="t3" class="pill off" onclick="pg('academy')">Academy</button><button id="t4" class="pill off" onclick="pg('mpesa')">M-Pesa</button><button class="pill off" onclick="lo()">Logout</button></div>

<div style="text-align:center;padding:4px;font-size:11px;color:#6b7280" id="ui"></div>

<!-- TRADING PAGE - YOUR SCREENSHOT -->
<div id="ptrading"><div class="balRow"><div class="balCard"><b>Balance</b><div class="v" id="vb">$10011.00</div><div style="font-size:13px;color:#9ca3af">Trades:<span id="tc">3</span></div></div><div class="balCard"><b>P&L</b><div class="v" id="pnl" style="font-size:26px">+$11.00</div></div></div>

<div class="chartWrap"><div class="tf"><button class="tfb">1m</button><button class="tfb">30m</button><button class="tfb">1h</button><button class="tfb on">15m</button><span style="margin-left:auto;color:#6b7280;font-size:12px">Euro / U.S. Dollar</span></div>
<!-- TradingView Real Chart Inserted -->
<div style="height:380px"><div id="tv" style="height:100%"></div></div>
</div>

<div class="card"><select id="pair" class="inp" style="margin:0"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>BTC/USD</option></select><input id="amt" class="inp" type="number" value="100"><div class="btns"><button class="buy" onclick="trade('BUY')">BUY</button><button class="sell" onclick="trade('SELL')">SELL</button></div><div id="msg" style="margin-top:10px;color:#00e080;font-weight:900">WIN +$8.00</div><div id="hist" style="font-size:12px;margin-top:10px;color:#9ca3af"></div></div>
</div>

<div id="pportfolio" style="display:none"><div class="card"><b>📊 Portfolio - Bar Graphs</b><div id="bar1"></div><div id="bar2" style="margin-top:10px;background:#000;padding:10px;border-radius:10px"></div><div id="phist" style="margin-top:10px"></div></div></div>
<div id="pacademy" style="display:none"><div class="card"><b>🎓 Academy</b><p style="color:#9ca3af;font-size:13px;margin-top:8px">Learn trading: BUY low, SELL high. Demo $10000 free. Practice here.</p><div style="background:#000;padding:12px;border-radius:10px;margin-top:10px"><div>Demo Balance: <b id="acBal" style="color:#00e080"></b></div><div>Real KES: <b id="acReal" style="color:#f59e0b"></b></div></div></div></div>
<div id="pmpesa" style="display:none"><div class="card"><b>💰 M-Pesa 0716580098</b><input id="da" class="inp" type="number" placeholder="Amount"><input id="dc" class="inp" placeholder="Code"><button class="buy" style="background:#f59e0b;width:100%" onclick="dep()">Deposit</button><div id="dh" style="font-size:12px;margin-top:8px"></div><div style="margin-top:16px"><b>Withdraw</b><input id="wa" class="inp" type="number" placeholder="Amount"><input id="wp" class="inp" placeholder="Phone"><button class="buy" style="width:100%" onclick="wit()">Withdraw</button><div id="wh" style="font-size:12px;margin-top:8px"></div></div></div><div id="ad" class="card" style="display:none"><b>ADMIN</b><div id="apD"></div><div id="apW"></div></div></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let cur=null,us=[],ds=[],ws=[];
try{us=JSON.parse(localStorage.getItem('v7_u')||localStorage.getItem('v6_u')||'[]')}catch(e){}
function sv(){localStorage.setItem('v7_u',JSON.stringify(us));if(cur)localStorage.setItem('v7_c',cur.user)}
function login(){let u=document.getElementById('u').value.trim();let pw=document.getElementById('p').value.trim();if(!u||!pw)return;let f=us.find(x=>x.user.toLowerCase()===u.toLowerCase());if(f){cur=f}else{cur={user:u,pass:pw,v:10011,r:0,tr:[{ty:'BUY',am:100,pnl:8},{ty:'SELL',am:100,pnl:-5},{ty:'BUY',am:100,pnl:8}]};us.push(cur)}sv();enter()}
function admin(){let f=us.find(x=>x.user==='Dragon 3106');if(f)cur=f;else{cur={user:'Dragon 3106',pass:'1234',v:10044,r:1500,tr:[]};us.push(cur)}sv();enter()}
function enter(){document.getElementById('auth').style.display='none';up();loadTV();pg('trading')}
function lo(){cur=null;localStorage.removeItem('v7_c');document.getElementById('auth').style.display='flex'}
function pg(n){['trading','portfolio','academy','mpesa'].forEach(x=>document.getElementById('p'+x).style.display='none');document.getElementById('p'+n).style.display='block';['t1','t2','t3','t4'].forEach((b,i)=>{let names=['trading','portfolio','academy','mpesa'];document.getElementById(b).className=names[i]===n?'pill on':'pill off'});up();if(n==='portfolio')bars()}
function up(){if(!cur)return;document.getElementById('ui').innerText=cur.user+' • '+new Date().toLocaleTimeString();let pl=cur.tr.reduce((a,b)=>a+b.pnl,0);document.getElementById('vb').innerText='$'+cur.v.toFixed(2);document.getElementById('tc').innerText=cur.tr.length;document.getElementById('pnl').innerText=(pl>=0?'+$':'-$')+Math.abs(pl).toFixed(2);document.getElementById('pnl').style.color=pl>=0?'#00e080':'#ef4444';document.getElementById('hist').innerHTML=cur.tr.slice(-5).reverse().map(t=>t.ty+' $'+t.am+' '+(t.pnl>=0?'+$':'$')+t.pnl.toFixed(2)).join('<br>');document.getElementById('phist').innerHTML=document.getElementById('hist').innerHTML;document.getElementById('acBal').innerText='$'+cur.v.toFixed(2);let r=document.getElementById('acReal');if(r)r.innerText='KES '+cur.r.toFixed(0);let ad=document.getElementById('ad');if(ad)ad.style.display=cur.user==='Dragon 3106'?'block':'none'}
function trade(ty){let am=parseFloat(document.getElementById('amt').value)||0;if(am>cur.v)return;let win=Math.random()>0.35;let pnl=win?8:-6;cur.v+=pnl;cur.tr.push({ty,am,pnl});sv();document.getElementById('msg').innerText=(win?'WIN +$':'LOSS $')+pnl.toFixed(2);document.getElementById('msg').style.color=win?'#00e080':'#ef4444';up();bars()}
function loadTV(){if(typeof TradingView==='undefined'){setTimeout(loadTV,500);return}new TradingView.widget({"autosize":true,"symbol":"FX:EURUSD","interval":"15","timezone":"Africa/Nairobi","theme":"dark","style":"1","locale":"en","toolbar_bg":"#0e1525","enable_publishing":false,"hide_top_toolbar":false,"save_image":false,"container_id":"tv"})}
function bars(){if(!cur||!cur.tr.length)return;let last=cur.tr.slice(-6);document.getElementById('bar1').innerHTML=last.map(t=>'<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><div style="width:60px;font-size:11px">'+t.ty+' $'+t.am+'</div><div style="height:18px;background:'+(t.pnl>=0?'#00e080':'#ef4444')+';width:'+Math.abs(t.pnl)*10+'px;border-radius:4px"></div><div style="font-size:11px">'+t.pnl.toFixed(0)+'</div></div>').join('');let w=cur.tr.filter(t=>t.pnl>0).length;document.getElementById('bar2').innerHTML='Wins:'+w+' Loss:'+(cur.tr.length-w)+' WinRate:'+((w/cur.tr.length)*100).toFixed(0)+'%' }
function dep(){let am=parseFloat(document.getElementById('da').value)||0;if(!am)return;cur.r+=am;document.getElementById('dh').innerText='✅ KES '+am+' added (Demo)';up();sv()}function wit(){let am=parseFloat(document.getElementById('wa').value)||0;if(am>cur.r||am<200)return;cur.r-=am;document.getElementById('wh').innerText='✅ KES '+am+' requested';up();sv()}
let s=localStorage.getItem('v7_c');if(s){let f=us.find(x=>x.user===s);if(f){cur=f;document.getElementById('auth').style.display='none';up();loadTV();}}
</script></body></html>
